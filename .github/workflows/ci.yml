name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  website:
    name: Platform (Django)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_DB: yakitori
          POSTGRES_USER: yakitori
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yakitori -d yakitori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-secret-0000000000000000
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: yakitori
      DATABASE_USER: yakitori
      DATABASE_PASSWORD: devpassword
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      # Keep cookies/redirects testable over http in CI.
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: smtp
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Dependency audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python website/scripts/secret_scan.py

  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
