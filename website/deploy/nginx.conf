# Yakitori platform — nginx site config
# Place at: /etc/nginx/sites-available/yakitori
# Enable with:  sudo ln -s /etc/nginx/sites-available/yakitori /etc/nginx/sites-enabled/
# Then:         sudo nginx -t && sudo systemctl reload nginx
#
# Replace yakitori.example with your real domain, then obtain a certificate:
#   sudo certbot --nginx -d yakitori.example
# Certbot fills in the ssl_certificate paths below.

server {
    listen 80;
    listen [::]:80;
    server_name yakitori.example;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yakitori.example;

    ssl_certificate     /etc/letsencrypt/live/yakitori.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yakitori.example/privkey.pem;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # WhiteNoise normally serves static files; this is a fallback and keeps
    # /static/ off the application process when nginx can serve it directly.
    location /static/ {
        alias /srv/yakitori/website/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/yakitori.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
